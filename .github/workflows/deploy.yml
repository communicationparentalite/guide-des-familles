name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Last Commit Date
        id: last-commit
        run: echo "date=$(git log -1 --format=%cd --date=format:'%d %B %Y')" >> $GITHUB_OUTPUT

      - name: Inject Date into Script
        run: |
          sed -i "s|<!-- LAST_UPDATED -->|${{ steps.last-commit.outputs.date }}|g" script.js

      - name: Build Pagefind Index
        run: npx -y pagefind --site .

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
