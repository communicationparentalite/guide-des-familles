    <style>
        /* ===== COULEURS SPÉCIFIQUES À PETITE ENFANCE (VERT CLAIR) ===== */
        .page-petite-enfance {
            --primary-color: #5be485;
            --primary-light: #8AEDA9;
            --primary-dark: #33B85D;
            --secondary-color: #3FCB6C;
            --secondary-light: #7DDD9C;
        }

        /* ===== PHOTO GALLERY ===== */
        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }

        .photo-gallery img {
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
            transition: transform 0.3s;
            width: 100%;
            height: 250px;
            object-fit: cover;
            cursor: pointer;
        }

        .photo-gallery img:hover {
            transform: scale(1.05);
        }

        /* ===== CARTES ===== */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .card {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
            transition: transform 0.3s, box-shadow 0.3s;
            border-top: 4px solid var(--primary-color);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .card h3 {
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .card h4 {
            color: var(--primary-dark);
            margin-bottom: 0.75rem;
            font-size: 1.1rem;
        }

        .card p {
            margin: 0.2rem 0;
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .card a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .card a:hover {
            text-decoration: underline;
        }

        /* ===== IMAGE + TEXTE ===== */
        .image-text-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: center;
            margin: 2rem 0;
        }

        .image-text-row img {
            border-radius: 8px;
            box-shadow: var(--shadow-md);
            width: 100%;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .image-text-row {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
        }

        /* ===== CONTENU SPÉCIFIQUE ===== */
        .pmi-logo {
            display: flex;
            align-items: flex-start;
            gap: 1.5rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }

        .pmi-logo img {
            width: 100px;
            flex-shrink: 0;
        }

        .pmi-logo p {
            text-align: justify;
            margin: 0;
        }

        .bulle-musicale {
            background-color: var(--primary-color);
            color: white;
            padding: 2rem;
            border-radius: 8px;
            margin: 2rem 0;
        }

        .bulle-musicale h3 {
            color: white;
        }

        .bulle-musicale .full-text {
            display: none;
        }

        .bulle-musicale .full-text.visible {
            display: block;
        }

        .bulle-musicale .read-more-btn {
            color: white;
            border-color: rgba(255,255,255,0.4);
        }

        .bulle-musicale .read-more-btn:hover {
            color: rgba(255,255,255,0.8);
        }

        .bulle-content {
            display: flex;
            align-items: flex-start;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .bulle-content .text {
            flex: 1;
            min-width: 250px;
        }

        .bulle-content img {
            width: 500px;
            max-width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .bulle-content {
                flex-direction: column;
            }
            .bulle-content img {
                width: 100%;
                height: 200px;
            }
            .pmi-logo {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
        }

        /* ===== SOUS-ACCORDÉON ACCUEIL COLLECTIF ===== */
        .sub-accordion-header {
            background: white;
            padding: 0.8rem 1.2rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
            font-weight: 700;
            color: var(--text-dark);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            font-family: 'Nunito', sans-serif;
        }

        .sub-accordion-header:hover {
            background: #f5f8ff;
        }

        .sub-accordion-header.open {
            background: var(--primary-light);
            color: white;
            border-color: var(--primary-color);
        }

        .sub-accordion-header.open span {
            color: white;
        }

        .sub-accordion-icon {
            font-size: 1.2rem;
            font-weight: 300;
            transition: transform 0.3s;
            flex-shrink: 0;
            margin-left: auto;
        }

        .sub-accordion-header.open .sub-accordion-icon {
            transform: rotate(45deg);
        }

        .sub-accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.3s ease;
            background: #fafbff;
            padding: 0 1.2rem;
        }

        .sub-accordion-body.open {
            max-height: 2000px;
            padding: 0.5rem 1.2rem 1rem;
        }

        .accueil-collectif-wrapper {
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .accueil-collectif-wrapper:last-child {
            margin-bottom: 0.5rem;
        }

        /* ===== YOUTUBE RESPONSIVE ===== */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            max-width: 100%;
            background: #000;
            border-radius: 8px;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
